[pytest]
pythonpath = .
# test_lookahead.py n'est pas un test pytest : c'est un script d'analyse qui
# lance un walk-forward complet au niveau module. L'importer (collecte VSCode/CLI)
# declenche un backtest de plusieurs minutes -> on l'exclut de la collecte.
# Il reste lançable a la main : python -m src.risk_off_strategy.test_lookahead
addopts = -s --ignore=src/risk_off_strategy/test_lookahead.py
norecursedirs = external venv .git outputs data
markers =
    network: test qui contacte Boursorama (peut etre instable)
    live: test qui authentifie le compte reel (actif si BOURSO_LIVE_TESTS=1)
